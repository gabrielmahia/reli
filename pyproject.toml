[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reli-cli"
version = "0.1.1"
description = "On-ramp to East Africa's MCP coordination stack — install, wire, verify, and demo 30+ Kenya-domain MCP servers in one command."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AfriKaziOS maintainers"}]
keywords = ["mcp", "kenya", "east-africa", "swahili", "ai-agents", "coordination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Installation/Setup",
]

[project.urls]
Homepage = "https://github.com/gabrielmahia/reli"
Repository = "https://github.com/gabrielmahia/reli"
Documentation = "https://gabrielmahia.github.io/nairobi-stack/"
Issues = "https://github.com/gabrielmahia/reli/issues"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"

[project.scripts]
reli = "reli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["reli"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned ruff in CI; these are documented, intentional patterns rather than debt:
#   BLE001/TRY004 — adapters and feed loops catch broadly ON PURPOSE so one bad
#                   source cannot sink an entire run (see adapters/pipeline).
#   S112          — `continue` on exception is the intended degrade-gracefully path.
#   PLW1510       — test subprocess calls assert on returncode explicitly.
#   C408/SIM103/RUF059/EXE001 — style-only; not worth churning working code.
ignore = ["BLE001", "TRY004", "S112", "PLW1510", "C408", "SIM103", "RUF059", "EXE001", "E501"]
